<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garagem Inteligente - Autenticação</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="notificacoes"></div>

    <!-- Seção de Autenticação (Inicialmente visível) -->
    <main id="auth-container" class="form-section" style="max-width: 500px; margin: 50px auto;">
        <div id="login-view">
            <h2><i class="fas fa-sign-in-alt"></i> Login na Garagem</h2>
            <form id="formLogin">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" required>
                <label for="loginPassword">Senha:</label>
                <input type="password" id="loginPassword" required>
                <button type="submit">Entrar</button>
            </form>
            <p>Não tem uma conta? <a href="#" id="showRegister">Registre-se aqui</a></p>
        </div>

        <div id="register-view" style="display: none;">
            <h2><i class="fas fa-user-plus"></i> Registrar Nova Conta</h2>
            <form id="formRegister">
                <label for="registerEmail">Email:</label>
                <input type="email" id="registerEmail" required>
                <label for="registerPassword">Senha:</label>
                <input type="password" id="registerPassword" required>
                <button type="submit">Registrar</button>
            </form>
            <p>Já tem uma conta? <a href="#" id="showLogin">Faça o login</a></p>
        </div>
    </main>

    <!-- Conteúdo Principal da Garagem (Inicialmente oculto) -->
    <div id="garage-container" style="display: none;">
        <header>
            <h1><i class="fas fa-warehouse"></i> Minha Garagem Inteligente</h1>
            <nav class="main-nav">
                <a href="#secao-garagem"><i class="fas fa-car"></i> Minha Garagem</a>
                <a href="#secao-adicionar-veiculo"><i class="fas fa-plus-circle"></i> Adicionar Veículo</a>
                <a href="#" id="logoutButton"><i class="fas fa-sign-out-alt"></i> Sair</a>
            </nav>
        </header>

        <main>
            <section id="secao-adicionar-veiculo" class="form-section">
                <h2><i class="fas fa-plus-circle"></i> Adicionar Novo Veículo</h2>
                <form id="formAdicionarVeiculo">
                    <label for="tipoVeiculo">Tipo:</label>
                    <select id="tipoVeiculo" required>
                        <option value="" disabled selected>Selecione o tipo</option>
                        <option value="Carro">Carro</option>
                        <option value="CarroEsportivo">Carro Esportivo</option>
                        <option value="Caminhao">Caminhão</option>
                    </select>
                    <label for="modeloVeiculo">Modelo:</label>
                    <input type="text" id="modeloVeiculo" placeholder="Ex: Fusca, Ferrari, Scania" required>
                    <label for="corVeiculo">Cor:</label>
                    <input type="text" id="corVeiculo" placeholder="Ex: Azul, Vermelho, Prata" required>
                    <div id="campoCapacidadeCarga" style="display: none;">
                        <label for="capacidadeCargaVeiculo">Capacidade de Carga (kg):</label>
                        <input type="number" id="capacidadeCargaVeiculo" min="0" placeholder="Ex: 10000">
                    </div>
                    <button type="submit"><i class="fas fa-save"></i> Adicionar à Garagem</button>
                </form>
            </section>

            <section id="secao-garagem" class="list-section">
                <h2><i class="fas fa-car"></i> Meus Veículos</h2>
                <div id="listaVeiculos"><p class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando veículos...</p></div>
            </section>
        </main>
    </div>

    <!-- O Modal de Detalhes permanece o mesmo -->
    <div id="modalDetalhesVeiculo" class="modal">
        <div class="modal-content">
             <!-- O conteúdo do modal permanece o mesmo do seu arquivo original -->
             <span class="close-button" onclick="fecharModal()">×</span>
            <h2 id="modalTituloVeiculo">Editar Veículo</h2>
            <div class="form-section">
                <form id="formEditarVeiculo">
                    <label for="editModeloVeiculo">Modelo:</label>
                    <input type="text" id="editModeloVeiculo" value="" required>
                    
                    <label for="editCorVeiculo">Cor:</label>
                    <input type="text" id="editCorVeiculo" value="" required>
                    
                    <div id="editCampoCapacidadeCarga" style="display:none;">
                        <label for="editCapacidadeCargaVeiculo">Capacidade de Carga (kg):</label>
                        <input type="number" id="editCapacidadeCargaVeiculo" value="0" min="0">
                    </div>

                    <button type="submit"><i class="fas fa-save"></i> Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>
    
    
    <script type="module" src="main.js"></script>
</body>
</html>
